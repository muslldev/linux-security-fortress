---
- name: Install SELinux
  ansible.builtin.dnf:
    name: policycoreutils-python-utils
    state: present

- name: Check SELinux status
  ansible.builtin.command: getenforce
  register: selinux_status
  changed_when: false

- name: Allow SSH port in SELinux
  community.general.seport:
    ports: "{{ ssh_port }}"
    proto: tcp
    setype: ssh_port_t
    state: present
