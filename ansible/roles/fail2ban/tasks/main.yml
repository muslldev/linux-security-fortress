---
- name: Install Fail2ban
  ansible.builtin.dnf:
    name: fail2ban
    state: present

- name: Ensure Fail2ban is enabled and running
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

- name: Configure SSH jail
  ansible.builtin.template:
    src: sshd.local.j2
    dest: /etc/fail2ban/jail.d/sshd.local
    owner: root
    group: root
    mode: '0644'
  notify: Restart Fail2ban

