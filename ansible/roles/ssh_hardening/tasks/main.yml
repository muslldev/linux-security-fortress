---
- name: Configure SSH daemon
  ansible.builtin.template:
    src: sshd_config.j2
    dest: /etc/ssh/sshd_config.d/99-security-hardening.conf
    owner: root
    group: root
    mode: '0600'
  notify: Restart SSH

- name: Validate SSH configuration
  ansible.builtin.command: sshd -t
  changed_when: false
    